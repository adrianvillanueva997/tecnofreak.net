name: Docker Build (CI)

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tecnofreak
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/tecnofreak
      PAYLOAD_SECRET: ci-build-secret-not-for-prod
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v7

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tecnofreak:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Docker image
        run: |
          set -eu
          docker run --rm -d --network host --name tecnofreak-ci-test \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            -e NEXT_PUBLIC_SERVER_URL="$NEXT_PUBLIC_SERVER_URL" \
            tecnofreak:ci-${{ github.sha }}
          trap 'docker rm -f tecnofreak-ci-test || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs tecnofreak-ci-test
          exit 1
