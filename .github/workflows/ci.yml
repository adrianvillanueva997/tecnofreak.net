name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-and-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tecnofreak
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/tecnofreak
      NODE_ENV: production
      PAYLOAD_SECRET: ci-build-secret-not-for-prod
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm generate:types

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Apply database migrations
        run: pnpm payload migrate

      - name: Run integration tests
        run: pnpm test:int

      - name: Build application
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: ${{ github.ref != 'refs/heads/main' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            tecnofreak:ci-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Docker image
        if: github.ref != 'refs/heads/main'
        run: |
          set -eu
          docker run --rm -d --network host --name tecnofreak-ci-test \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            -e NEXT_PUBLIC_SERVER_URL="$NEXT_PUBLIC_SERVER_URL" \
            tecnofreak:ci-${{ github.sha }}
          trap 'docker rm -f tecnofreak-ci-test || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs tecnofreak-ci-test
          exit 1
