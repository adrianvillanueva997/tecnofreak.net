# Stack de producción para el VPS — cms.tecnofreak.net vía Traefik
#
# Requisitos previos en el VPS:
#   1. Red externa `proxy` existente (la usa Traefik)
#   2. Archivo .env junto a este compose con:
#        POSTGRES_PASSWORD=<contraseña fuerte>
#        PAYLOAD_SECRET=<mismo secreto que en local>
#        NEXT_PUBLIC_SERVER_URL=https://cms.tecnofreak.net
#   3. Edita la línea `image:` de abajo con tu usuario/repo de GitHub:
#        ghcr.io/<usuario>/<repo>:latest
#   4. Login a GHCR si el paquete es privado:
#        docker login ghcr.io -u <usuario> -p <PAT con scope read:packages>
#   5. Restaurar datos: pg_restore del dump local + rsync de public/media → volumen media_data
#
# Arranque:  docker compose -f compose.prod.yml up -d

services:
  cms:
    image: ghcr.io/adrianvillanueva997/tecnofreak.net:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD}@db:5432/tecnofreak
      NODE_ENV: production
      AMAZON_TAG: ${AMAZON_TAG:-}
    volumes:
      - media_data:/app/public/media
    labels:
      - traefik.enable=true
      - traefik.http.routers.cms-https.rule=Host(`cms.tecnofreak.net`)
      - traefik.http.routers.cms-https.entrypoints=https
      - traefik.http.routers.cms-https.tls=true
      - traefik.http.routers.cms-https.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.cms.loadbalancer.server.port=3000
    networks:
      - proxy
      - cms_internal

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: tecnofreak
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - cms_internal

volumes:
  db_data:
  media_data:

networks:
  cms_internal:
    driver: bridge
  proxy:
    external: true
