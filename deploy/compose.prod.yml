services:
  cms:
    image: ghcr.io/adrianvillanueva997/tecnofreak.net:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD}@db:5432/tecnofreak
      NODE_ENV: production
      AMAZON_TAG: ${AMAZON_TAG:-}
    volumes:
      - /mnt/tecnofreak/media_data:/app/public/media
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    user: "1000:1000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cms-https.rule=Host(`cms.tecnofreak.net`)
      - traefik.http.routers.cms-https.entrypoints=https
      - traefik.http.routers.cms-https.tls=true
      - traefik.http.routers.cms-https.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.cms.loadbalancer.server.port=3000
    networks:
      - proxy
      - cms_internal

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: tecnofreak
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/tecnofreak/db_data:/var/lib/postgresql/data:rw
      - ./init-cms.sh:/docker-entrypoint-initdb.d/01-cms.sh:ro
    expose:
      - "5432"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run/postgresql:rw,noexec,nosuid,size=8m
    user: "70:70"
    networks:
      - cms_internal
      - postgres_network

networks:
  cms_internal:
    driver: bridge
  proxy:
    external: true
  postgres_network:
    external: true
